<style>
:root{--ink:#143c39;--muted:#687e7b;--mint:#c2f1dc;--green:#137565;--paper:#f5f7f1;--line:#dfe7df;--white:#fff;--peach:#ffe1c8;--red:#ad4a43;--shadow:0 12px 32px #153c3910}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,system-ui,sans-serif;line-height:1.6}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer;border:0}button:disabled{cursor:wait;opacity:.55}button:focus-visible,a:focus-visible{outline:3px solid #e9ae50;outline-offset:3px}a{color:var(--green)}.shell{max-width:1320px;margin:auto;display:grid;grid-template-columns:235px 1fr;min-height:100vh}.sidebar{padding:30px 20px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:#fbfcf8}.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:900;letter-spacing:-1px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted)}.brand-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--ink);color:var(--mint)}nav{display:grid;gap:6px;margin-top:34px}nav button{padding:12px;border-radius:12px;background:transparent;text-align:left;color:var(--muted);display:flex;align-items:center;gap:10px}nav button.active{background:var(--mint);color:var(--ink);font-weight:bold}nav button:hover{background:#e6f2e8}.footnote{font-size:12px;color:var(--muted);margin-top:32px}.workspace{padding:26px 34px 48px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:bold;color:var(--green)}h1{font-size:27px;letter-spacing:-.6px;margin:4px 0}h2{font-size:21px;margin:0 0 10px}h3{font-size:16px;margin:0}p{margin:6px 0}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.account{background:#fff;border:1px solid var(--line);border-radius:30px;padding:8px 15px;font-size:12px}.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;border-radius:26px;background:var(--ink);color:#fff;padding:28px;margin:24px 0;overflow:hidden;position:relative}.hero p{color:#c2d8cf;font-size:13px;max-width:480px}.hero h2{font-size:27px}.hero .tag{background:#ffffff1c;color:var(--mint)}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:22px;box-shadow:var(--shadow)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px}.metric:first-child{background:var(--mint)}.metric .value{font-size:27px;font-weight:900;margin-top:8px;letter-spacing:-1px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:grid;gap:15px}.tag{display:inline-block;background:#eef5ef;border-radius:20px;padding:4px 10px;color:var(--green);font-size:11px;font-weight:bold}.tag.warn{background:var(--peach);color:#965327}.tag.paid{background:#d5f4e6;color:#126b50}.amount{font-size:26px;font-weight:bold;margin:12px 0}.btn{border-radius:12px;padding:11px 16px;background:var(--green);color:white;font-weight:bold;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;font-size:13px}.btn.soft{background:#ecf5ee;color:var(--ink)}.btn.danger{background:#fce9e5;color:var(--red)}.btn.light{background:var(--mint);color:var(--ink)}.full{width:100%}.bill-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.bill-head .face{font-size:30px;background:#f6f7ee;border-radius:15px;padding:6px 12px}.divider{height:1px;background:var(--line);margin:16px 0}.progress{height:6px;background:#eaf0e9;border-radius:10px;margin:12px 0;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}.icon{width:20px;height:20px;flex-shrink:0;vertical-align:middle}.empty{padding:44px;text-align:center}.empty .face{font-size:44px}.pager{display:flex;justify-content:center;gap:16px;align-items:center;margin:22px 0}.notice{padding:14px 18px;border-radius:13px;background:#e9f2fa;color:#275c7d;margin:14px 0;font-size:13px}.notice.error{background:#fce9e5;color:var(--red)}.notice.success{background:#d5f4e6;color:var(--green)}label{display:grid;gap:7px;font-size:13px;font-weight:bold}input,select,textarea{padding:12px 14px;border:1px solid #cddbd3;border-radius:12px;background:#fff;width:100%;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:2px solid #82cbb5;outline-offset:1px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formgrid .wide{grid-column:1/-1}.members{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:12px}.members label,.check{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line);font-weight:normal}.check input,.members input{width:18px;height:18px;flex-shrink:0}.drop{padding:22px;border:2px dashed #a2c6b7;border-radius:16px;background:#f6fbf7;text-align:center}.drop input{margin-top:12px;font-size:12px;padding:6px}.preview{display:block;max-width:100%;max-height:280px;margin:auto;border-radius:13px}.hide{display:none!important}.skeleton{height:135px;border-radius:20px;background:linear-gradient(90deg,#e2eae0,#f9fcf6,#e2eae0);background-size:250% 100%;animation:shimmer 1.4s infinite}.skeleton.short{height:24px;width:45%;margin-bottom:20px}@keyframes shimmer{to{background-position:-200% 0}}.fade{animation:enter .24s ease both}@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.pig{width:118px;height:102px;background:#f3bfc0;border-radius:48% 48% 43% 43%;position:relative;flex-shrink:0;transform:rotate(-7deg);animation:bob 4s ease-in-out infinite;margin:12px 10px}.pig:before,.pig:after{content:'';position:absolute;background:#edb1b4;width:32px;height:34px;top:-12px;border-radius:8px 25px 0 25px}.pig:before{left:4px;transform:rotate(-25deg)}.pig:after{right:4px;transform:rotate(25deg)}.eyes{position:absolute;z-index:1;top:23px;left:19px;width:80px;display:flex;justify-content:space-between}.eyes i{width:29px;height:25px;border:3px solid var(--ink);border-radius:50%;position:relative}.eyes i:after{content:'';background:var(--ink);width:5px;height:7px;border-radius:50%;position:absolute;top:6px;left:10px}.nose{position:absolute;bottom:16px;left:37px;width:46px;height:29px;background:#db8c99;border-radius:50%;color:#964b61;text-align:center;letter-spacing:6px;padding-left:6px;font-size:20px}.coin{position:absolute;left:46px;top:-31px;background:#f7d57e;border:3px solid #e6b448;border-radius:50%;width:30px;height:30px;color:#9b6b23;line-height:24px;text-align:center;z-index:2}@keyframes bob{50%{transform:rotate(5deg) translateY(-5px)}}dialog{border:0;border-radius:22px;max-width:500px;width:calc(100% - 32px);padding:26px;color:var(--ink);box-shadow:0 25px 80px #0004}dialog::backdrop{background:#103d3a88;backdrop-filter:blur(4px)}.table-row{padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start;gap:14px}.mobile-menu{display:none}.spinner{width:16px;height:16px;border:2px solid #ffffff50;border-top-color:currentColor;border-radius:50%;animation:turn .8s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}
@media(max-width:850px){.shell{display:block}.sidebar{position:static;height:auto;padding:15px;border:0}.sidebar .brand{font-size:19px}.sidebar .footnote{display:none}nav{margin:14px 0 0;display:flex;overflow:auto;padding-bottom:5px}nav button{white-space:nowrap;font-size:12px;padding:9px 11px}.workspace{padding:10px 16px 34px}.topbar{padding-bottom:13px}h1{font-size:22px}.hero{padding:23px 20px;margin:18px 0;gap:12px}.hero h2{font-size:22px}.pig{transform:scale(.85);margin-right:0;width:110px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:1fr}.account{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.formgrid{grid-template-columns:1fr}.metric{padding:17px}.metric .value{font-size:24px}.card{padding:19px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

<body>
<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-icon">฿</span><div>SEC1<small>YOUR LITTLE MONEY PAL</small></div></div><nav id="nav" aria-label="เมนูหลัก"></nav><div class="footnote">น้องกระปุกดูแลให้ 💚<br>เก็บเงินเป็นเรื่องของทีม<br>ความโปร่งใสเป็นเรื่องของเรา</div></aside><main class="workspace"><header class="topbar"><div><div class="eyebrow">SECTION ONE / MONEY TOGETHER</div><h1 id="title">สวัสดี น้องกระปุกเองครับ</h1></div><div class="account" id="identity">SEC1 • พร้อมช่วยคุณ</div></header><section id="content" aria-live="polite"></section><p class="muted small" id="updated"></p></main></div>
<dialog id="modal"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="row" style="margin-top:20px"><button class="btn" id="dialogYes">ยืนยัน</button><button class="btn soft" id="dialogNo">ยกเลิก</button></div></dialog>
<script>
'use strict';
const CONFIG={"apiUrl": "https://script.google.com/macros/s/AKfycbyx6FHcm9gs3TeEopijpRug8z8sXpo9iLm6v3qavCj0-2W8zwA6keSWgAc6qiPj7mVzXw/exec", "liffId": "2011470307-gvcrsOhk"};
const IS_LIFF=true;
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0)+' ฿';
const day=d=>d?new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Bangkok'}):'—';
const rid=()=>crypto.randomUUID();
const NAMES={'my-bills':'บิลของฉัน','open-bills':'บิลที่กำลังเรียกเก็บ',summary:'สรุปยอดเงิน',expenses:'รายจ่ายทั้งหมด',history:'ประวัติของฉัน','create-bill':'สร้างบิล','create-withdrawal':'บันทึกถอนเงิน',plans:'แผนรายเดือน',reviews:'ตรวจสลิป',notifications:'สถานะการแจ้งเตือน',payment:'ชำระบิล'};
const ICONS={'my-bills':'M6 3h12v18l-3-2-3 2-3-2-3 2z M9 8h6 M9 12h6','open-bills':'M3 10v4h4l11 5V5L7 10z M7 14l2 7',summary:'M3 7h18v14H3z M3 7V4h15 M16 12h5v5h-5z',expenses:'M4 6h16v15H4z M8 6V3h8v3 M8 11h8 M8 15h5',history:'M3 12a9 9 0 1 0 3-7 M3 3v6h6 M12 7v5l3 2',plans:'M4 5h16v16H4z M8 2v6 M16 2v6 M4 10h16',reviews:'M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16 M16 16l6 6',notifications:'M5 17V9a7 7 0 0 1 14 0v8l2 2H3z M9 22h6'};
const icon=k=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[k]||'M12 4v16 M4 12h16'}"/></svg>`;
const pig=()=>'<div class="pig" aria-label="น้องกระปุกใส่แว่น"><div class="coin">฿</div><div class="eyes"><i></i><i></i></div><div class="nose">••</div></div>';
const hero=(title,sub)=>`<div class="hero"><div><span class="tag">SEC1 MONEY PAL</span><h2 style="margin-top:12px">${esc(title)}</h2><p>${esc(sub)}</p></div>${pig()}</div>`;
let session=null,token='',view='my-bills',page=1,billId='',data=null,seq=0,busy=false;
function route(){const u=new URL(location.href),extra=u.searchParams.get('liff.state');let p=u.searchParams;if(extra){let e=extra;try{e=decodeURIComponent(e)}catch(_){}const q=e.indexOf('?');const more=new URLSearchParams(q>=0?e.slice(q+1):e.replace(/^\//,''));more.forEach((v,k)=>{if(!p.has(k))p.set(k,v)});}billId=p.get('billId')||'';view=billId?'payment':(NAMES[p.get('view')]?p.get('view'):'my-bills');}
async function api(action,body={}){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),action==='secRead'?45000:150000);try{const response=await fetch(CONFIG.apiUrl,{method:'POST',signal:controller.signal,cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,accessToken:token,...body})});let out;try{out=await response.json()}catch(e){throw Error('Backend ตอบกลับไม่ถูกต้อง ตรวจ URL /exec และสิทธิ์ Web app')};if(!out.success)throw Error(out.message||'ทำรายการไม่สำเร็จ');return out;}catch(e){if(e.name==='AbortError')throw Error('ระบบใช้เวลานาน กรุณาเปิดเมนูเพื่อตรวจสถานะก่อนส่งซ้ำ');throw e}finally{clearTimeout(timeout)}}
function nav(){const keys=['my-bills','open-bills','summary','expenses','history'];if(session?.isAdmin)keys.push('create-bill','plans','create-withdrawal','reviews','notifications');$('#nav').innerHTML=keys.map(k=>`<button data-view="${k}" class="${view===k?'active':''}">${icon(k)}${NAMES[k]}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!busy)load(b.dataset.view)});}
function skeleton(){return '<div style="margin-top:24px"><div class="skeleton short"></div><div class="cards"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><p class="muted">กำลังอ่านข้อมูลล่าสุด…</p></div>';}
function error(e){$('#content').innerHTML=`<div class="notice error">${esc(e.message||e)}</div><button class="btn soft" id="retry">ลองโหลดอีกครั้ง</button>`;$('#retry').onclick=()=>load(view,page,billId);}
async function load(v,p=1,id=''){if(busy)return;const ticket=++seq;view=v;page=p;billId=id;$('#title').textContent=NAMES[v]||'รายละเอียดบิล';$('#content').innerHTML=skeleton();$('#updated').textContent='';nav();try{const out=await api('secRead',{view:v,page:p,billId:id});if(ticket!==seq)return;session=out.session;data=out.data;$('#identity').textContent=(session.isAdmin?'Admin • ':'')+(session.memberName||session.displayName);nav();render();$('#updated').textContent='อ่านจากฐานข้อมูลเมื่อ '+new Date(out.updatedAt).toLocaleTimeString('th-TH');}catch(e){if(ticket===seq)error(e)}}
async function ask(title,html){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=html;$('#modal').showModal();return new Promise(resolve=>{let done=false;function finish(v){if(done)return;done=true;$('#modal').close();resolve(v)}$('#dialogYes').onclick=()=>finish(true);$('#dialogNo').onclick=()=>finish(false);$('#modal').oncancel=e=>{e.preventDefault();finish(false)}})}
async function mutate(btn,action,body,after){if(busy)return;busy=true;const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spinner"></span> กำลังดำเนินการ';try{const r=await api(action,body);busy=false;await after(r)}catch(e){busy=false;const el=$('#formError');if(el)el.innerHTML=`<div class="notice error">${esc(e.message)}</div>`;else await ask('ทำรายการไม่สำเร็จ',`<p>${esc(e.message)}</p>`)}finally{busy=false;if(btn.isConnected){btn.disabled=false;btn.innerHTML=old}}}
function empty(text){return `<div class="card empty"><div class="face">😊</div><h3>${esc(text)}</h3><p class="muted">น้องกระปุกพร้อมช่วยเมื่อมีรายการครับ</p></div>`;}
function pager(h){if(!h||h.pages<=1)return;$('#content').insertAdjacentHTML('beforeend',`<div class="pager"><button class="btn soft" id="prev" ${h.hasPrevious?'':'disabled'}>ก่อนหน้า</button><span>${h.page} / ${h.pages}</span><button class="btn soft" id="next" ${h.hasNext?'':'disabled'}>ถัดไป</button></div>`);$('#prev').onclick=()=>load(view,h.page-1,billId);$('#next').onclick=()=>load(view,h.page+1,billId);}
function render(){if(view==='summary')return summary();if(view==='create-bill')return createBill();if(view==='create-withdrawal')return withdrawal();if(view==='payment')return payment();if(view==='bill-detail')return billDetail();if(view==='plans')return plans();if(view==='reviews')return reviews();if(view==='notifications')return notifications();if(view==='expenses'||view==='history')return history();bills();}
function summary(){const s=data.financeSummary;$('#content').innerHTML=hero('กระปุกของทีม วันนี้เป็นอย่างไร?','ยอดรับ รายจ่าย และยอดถอน อัปเดตจากบัญชีของทีม')+`<div class="metrics">${[['คงเหลือสุทธิ',s.balance],['รับทั้งหมด',s.income],['ยอดค้างรับ',s.outstanding],['รายจ่าย',s.expenses],['ถอนนำไปใช้',s.withdrawn]].map(([t,n])=>`<div class="metric"><div class="muted">${t}</div><div class="value">${money(n)}</div></div>`).join('')}</div><div class="notice">สลิปที่รอตรวจสอบยังไม่นับเป็นเงินรับ จน Admin ยืนยันเงินเข้าแล้ว</div>`;}
function bills(){const h=data.history;$('#content').innerHTML=hero(view==='my-bills'?'เช็กบิลแล้ว สบายใจได้เลย':'เก็บเงินด้วยกัน โปร่งใสทุกบิล','ยอดที่แสดงเป็นยอดล่าสุด กดเปิดบิลเพื่อส่งหลักฐานได้ทันที')+(h.items.length?`<div class="cards">${h.items.map(b=>{const paid=b.paymentStatus==='paid',late=new Date(b.dueDate)<new Date(),sub=(data.submissions||[]).find(s=>s.billId===b.id);return `<article class="card fade"><div class="bill-head"><span class="tag ${paid?'paid':late?'warn':''}">${b.billType==='monthly'?'รายเดือน':'กิจกรรม'}</span><span class="face">${paid?'🥳':late?'😤':'🥺'}</span></div><h3>${esc(b.title)}</h3><p class="muted">ครบกำหนด ${day(b.dueDate)}</p><div class="amount">${money(view==='my-bills'?Math.max(0,b.amount-b.paidAmount):b.outstanding)}</div><p class="small muted">${paid?'ชำระครบแล้ว ขอบคุณครับ':sub?'หลักฐาน: '+status(sub.status):'ยอดคงเหลือที่เรียกเก็บ'}</p><div class="progress"><span style="width:${Math.min(100,Math.max(0,(b.paidCount/Math.max(1,b.memberCount))*100))}%"></span></div><p class="muted">ชำระแล้ว ${b.paidCount} / ${b.memberCount} คน</p><button class="btn soft full" data-pay="${esc(b.id)}">${icon('my-bills')}เปิดรายละเอียดบิล</button>${session.isAdmin&&b.status==='open'?`<button class="btn soft full" style="margin-top:8px" data-remind="${esc(b.id)}">แจ้งเตือนผู้ค้าง</button>`:''}</article>`}).join('')}</div>`:empty('ยังไม่มีบิลในรายการนี้'));document.querySelectorAll('[data-pay]').forEach(btn=>btn.onclick=()=>load(view==='open-bills'?'bill-detail':'payment',1,btn.dataset.pay));document.querySelectorAll('[data-remind]').forEach(btn=>btn.onclick=async()=>{if(await ask('แจ้งเตือนบิลนี้','<p>ส่งเฉพาะผู้ค้าง ช่องทางที่ส่งแล้ววันนี้จะถูกข้าม</p>'))mutate(btn,'secRemind',{billId:btn.dataset.remind},r=>ask('ผลการส่ง',`<p>LINE รับคำขอ ${r.accepted} • ล้มเหลว ${r.failed} • ข้าม ${r.skipped}</p>`))});pager(h);}
function billDetail(){const b=data.bill;$('#content').innerHTML=hero(b.title,'ชำระแล้ว '+b.paidCount+' / '+b.memberCount+' คน')+`<div class=card>${data.members.map(m=>`<div class=table-row><span>${esc(m.memberName)} <small>${m.status==='paid'?'🥳 ชำระแล้ว':'🥺 ค้างชำระ'}</small></span><strong>${money(Math.max(0,m.amount-m.paidAmount))}</strong></div>`).join('')}${data.canPay?'<button class=btn id=payDetail>เปิดบิลของฉันเพื่อส่งสลิป</button>':''}</div>`;if($('#payDetail'))$('#payDetail').onclick=()=>load('payment',1,b.id);}
function status(s){return ({draft:'ตรวจข้อมูลก่อนส่ง',pending:'รอ Admin ตรวจสอบ',posting:'กำลังลงบัญชี',approved:'อนุมัติแล้ว',rejected:'ไม่ผ่าน',accepted:'LINE รับคำขอแล้ว',failed:'ส่งล้มเหลว',sending:'กำลังส่ง'})[s]||s;}
function history(){const h=data.history;$('#content').innerHTML=hero(view==='expenses'?'เงินทุกบาท เล่าเรื่องได้':'ประวัติการชำระของคุณ',view==='expenses'?'ดูว่าใช้เงินกับอะไร เมื่อไหร่ และจำนวนเท่าไร':'รายการที่ได้รับการยืนยันแล้ว')+(h.items.length?`<div class="card">${h.items.map(x=>`<div class="table-row"><div><h3>${esc(x.title)}</h3><p class="muted">${day(x.date)} • ${view==='expenses'?(x.kind==='withdrawal'?'ถอนนำไปใช้':'รายจ่าย'):'ชำระเงิน'}</p></div><strong>${money(x.amount)}</strong></div>`).join('')}</div>`:empty('ยังไม่มีประวัติ'));pager(h);}
function membersForm(m){return `<div class="wide"><div class="row between"><h3>สมาชิกที่เรียกเก็บ</h3><button type="button" class="btn soft" id="all">เลือกทั้งหมด</button></div><div class="members">${m.map(x=>`<label><input type="checkbox" name="member" value="${esc(x.id)}">${esc(x.name)}</label>`).join('')}</div></div>`;}
function createBill(){const requestId=rid();$('#content').innerHTML=hero('สร้างบิล ให้กระปุกดูแลต่อ','เลือกสมาชิก ตั้งยอดต่อคน และวันครบกำหนด')+`<form id="form" class="card formgrid"><label>ประเภท<select name="billType"><option value="activity">กิจกรรมเฉพาะกิจ</option><option value="monthly">แผนรายเดือน</option></select></label><label>ยอดต่อคน<input name="amountPerMember" type="number" min="0.01" step="0.01" required></label><label class="wide">ชื่อบิล<input name="title" maxlength="100" required></label><label id="dueLabel">วันครบกำหนด<input name="dueDate" type="date" required value="${esc(data.today)}"></label><label id="monthlyLabel" class="hide">วันที่ครบกำหนดในเดือน<input name="dueDay" type="number" min="23" max="28" value="28"></label>${membersForm(data.members)}<label class="wide">หมายเหตุ<textarea name="note" rows="2"></textarea></label><div class="wide notice">รายเดือนสร้างบิลในวันที่ 23–28 และตรวจแจ้งเตือนวันละครั้ง มีรอบสำรองสำหรับช่องทางที่ล้มเหลว</div><button class="btn wide">สร้างรายการ</button><div class="wide" id="formError"></div></form>`;const f=$('#form');f.billType.onchange=()=>{const m=f.billType.value==='monthly';$('#dueLabel').classList.toggle('hide',m);$('#monthlyLabel').classList.toggle('hide',!m);f.dueDate.required=!m};$('#all').onclick=()=>{const inputs=[...f.querySelectorAll('[name=member]')],checked=inputs.every(i=>i.checked);inputs.forEach(i=>i.checked=!checked)};f.onsubmit=e=>{e.preventDefault();const b=Object.fromEntries(new FormData(f));b.memberIds=[...f.querySelectorAll('[name=member]:checked')].map(i=>i.value);if(!b.memberIds.length){$('#formError').textContent='เลือกสมาชิกอย่างน้อยหนึ่งคน';return}mutate(f.querySelector('button[type=submit]')||f.querySelector('.btn.wide'),'secCreate',{...b,requestId},()=>load(b.billType==='monthly'?'plans':'open-bills'))};}
function fileForm(){return '<label class="drop wide">📷 เลือกรูปหลักฐาน<input id="file" type="file" accept="image/jpeg,image/png,image/webp" required><span class="muted">ย่อรูปก่อนส่ง โดยคงรายละเอียดสลิป</span></label><img id="preview" class="preview hide wide" alt="ตัวอย่างหลักฐาน">';}
async function compress(file){if(file.size>20000000)throw Error('รูปต้นฉบับใหญ่เกิน 20 MB');return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const scale=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);const imageBase64=c.toDataURL('image/jpeg',.86);URL.revokeObjectURL(url);resolve({imageBase64,mimeType:'image/jpeg'})};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('อ่านภาพไม่ได้ กรุณาใช้ JPEG หรือ PNG'))};img.src=url});}
function bindFile(){let img=null,generation=0,pending=false;$('#file').onchange=async e=>{const turn=++generation;img=null;pending=true;$('#preview').classList.add('hide');try{const f=e.target.files[0];if(!f)return;const next=await compress(f);if(turn===generation){img=next;$('#preview').src=next.imageBase64;$('#preview').classList.remove('hide')}}catch(e){$('#formError').textContent=e.message}finally{if(turn===generation)pending=false}};return ()=>{if(pending)throw Error('กำลังเตรียมรูป กรุณารอสักครู่');if(!img)throw Error('กรุณาเลือกรูปหลักฐาน');return img};}
function withdrawal(){const requestId=rid();$('#content').innerHTML=hero('บันทึกการใช้เงิน อย่างโปร่งใส','ยอดคงเหลือก่อนถอน '+money(data.availableBalance))+`<form id="form" class="card formgrid"><label>วันที่ถอน<input name="date" type="date" value="${esc(data.today)}" required></label><label>จำนวนเงิน<input name="amount" type="number" min="0.01" step="0.01" max="${Number(data.availableBalance)}" required></label><label class="wide">ใช้ทำอะไร<textarea name="purpose" required maxlength="500"></textarea></label>${fileForm()}<button class="btn wide">บันทึกถอนเงิน</button><div id="formError" class="wide"></div></form>`;const get=bindFile(),f=$('#form');f.onsubmit=async e=>{e.preventDefault();let image;try{image=get()}catch(e){$('#formError').textContent=e.message;return}const b=Object.fromEntries(new FormData(f));if(!await ask('ยืนยันถอนเงิน',`<p>${money(b.amount)} • ${esc(b.purpose)}</p><p class="muted">รายการจะหักจากยอดคงเหลือและแจ้งในกลุ่ม</p>`))return;mutate(f.querySelector('button'),'secWithdraw',{...b,...image,requestId},()=>load('expenses'))};}
function payment(){const b=data.bill,a=data.assignment,bank=data.bank,sub=(data.submissions||[]).find(x=>x.billId===b.id&&['draft','pending','posting'].includes(x.status));$('#content').innerHTML=hero(b.title,`${b.billType==='monthly'?'รายเดือน':'กิจกรรม'} • ${session.memberName} • ครบกำหนด ${day(b.dueDate)}`)+`<div class="cards"><div class="card"><span class="muted">ยอดค้างชำระ</span><div class="amount">${money(Math.max(0,a.amount-a.paidAmount))}</div><div class="divider"></div><h3>${esc(bank.bankName)}</h3><div class="amount" style="font-size:22px">${esc(bank.bankAccountNo)}</div><p>${esc(bank.bankAccountName)}</p><button class="btn soft" id="copy">คัดลอกเลขบัญชี</button></div><div id="proof"></div></div><div id="formError"></div>`;$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(String(bank.bankAccountNo));$('#copy').textContent='คัดลอกแล้ว ✓'}catch(e){await ask('เลขบัญชี',`<p>กดค้างเพื่อคัดลอก: ${esc(bank.bankAccountNo)}</p>`)}};if(a.status==='paid'||b.status!=='open'){$('#proof').innerHTML=empty('บิลนี้ชำระครบหรือปิดแล้ว');return}if(sub?.status==='draft'){draft(sub);return}if(sub){$('#proof').innerHTML=empty('🔎 กำลังรอ Admin ยืนยันเงินเข้า');return}$('#proof').innerHTML=`<form id="form" class="card stack">${fileForm()}<p class="muted">OCR ช่วยอ่านข้อมูล ยังไม่ใช่การยืนยันเงินเข้า</p><button class="btn">อัปโหลดและอ่านสลิป</button></form>`;const requestId=rid(),get=bindFile(),f=$('#form');f.onsubmit=e=>{e.preventDefault();let image;try{image=get()}catch(e){$('#formError').textContent=e.message;return}mutate(f.querySelector('button'),'secUpload',{...image,requestId,billId},r=>draft(r))};}
function draft(r){let o={};try{o=JSON.parse(r.ocr||'{}')}catch(e){}$('#proof').innerHTML=`<form class="card stack" id="draft"><span class="tag">🔎 อ่านข้อมูลแล้ว</span><h3>ตรวจยอดก่อนส่งให้ Admin</h3><label>ยอดโอน<input name="amount" type="number" min="0.01" step="0.01" required value="${Number(r.amount)||0}"></label><label>วันที่โอน<input name="date" type="date" required value="${esc(r.date||'')}"></label><p class="muted">ผู้โอน: ${esc(o.senderName||'อ่านไม่ได้')}<br>ผู้รับ: ${esc(o.receiverName||'อ่านไม่ได้')}<br>อ้างอิง: ${esc(o.referenceNo||'อ่านไม่ได้')}</p><label>หมายเหตุ<textarea name="note"></textarea></label><div class="notice">ยอดรับจะเพิ่มหลัง Admin ตรวจเงินเข้าจากธนาคารแล้วเท่านั้น</div><button class="btn">ส่งให้ตรวจสอบ</button></form>`;const f=$('#draft');f.onsubmit=e=>{e.preventDefault();mutate(f.querySelector('button'),'secSubmit',{...Object.fromEntries(new FormData(f)),id:r.id},()=>load('my-bills'))};}
function plans(){const h=data.history;$('#content').innerHTML=hero('ตั้งครั้งเดียว ดูแลเป็นรายเดือน','ตรวจแผนที่เปิดใช้งานและเดือนล่าสุดที่สร้างบิล')+(h.items.length?`<div class="cards">${h.items.map(p=>`<div class="card"><span class="tag">${p.status==='active'?'เปิดใช้งาน':'หยุดแล้ว'}</span><h3>${esc(p.title)}</h3><div class="amount">${money(p.amountPerMember)} <small class="muted">/ คน</small></div><p>สร้างวันที่ 23 • ครบกำหนดวันที่ ${esc(p.dueDay)}</p><p class="muted">สร้างล่าสุด: ${esc(p.lastGeneratedMonth||'ยังไม่ถึงรอบสร้าง')}</p><p class="muted">สมาชิก ${String(p.memberIds||'').split(',').filter(Boolean).length} คน</p>${p.status==='active'?`<button class="btn danger" data-stop="${esc(p.id)}">หยุดแผนนี้</button>`:''}</div>`).join('')}</div>`:empty('ยังไม่มีแผนรายเดือน'));document.querySelectorAll('[data-stop]').forEach(btn=>btn.onclick=async()=>{if(await ask('หยุดแผนรายเดือน','<p>บิลที่สร้างไปแล้วจะยังคงอยู่</p>'))mutate(btn,'secStopPlan',{id:btn.dataset.stop,requestId:rid()},()=>load('plans'))});pager(h);}
function safeUrl(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:''}catch(e){return ''}}
function reviews(){const h=data.history;$('#content').innerHTML=hero('ตรวจยอดจริง ก่อนเติมกระปุก','เปรียบเทียบหลักฐานกับรายการเงินเข้าธนาคาร แล้วจึงอนุมัติ')+(h.items.length?`<div class="cards">${h.items.map(r=>`<article class="card"><span class="tag warn">${status(r.status)}</span><h3>${esc(r.memberName)}</h3><p class="muted">บิล ${esc(r.billTitle||r.billId)} • ${day(r.date)}</p><div class="amount">${money(r.amount)}</div><p class="muted">อ้างอิงจากสลิป: ${esc(r.reference||'อ่านไม่ได้')}</p><div class="row wrap"><a class="btn soft" href="${esc(safeUrl(r.proofUrl))}" target="_blank" rel="noopener">เปิดหลักฐาน</a><button class="btn" data-approve="${esc(r.id)}">ตรวจและอนุมัติ</button><button class="btn danger" data-reject="${esc(r.id)}">ไม่ผ่าน</button></div></article>`).join('')}</div>`:empty('ไม่มีสลิปรอตรวจสอบ'));document.querySelectorAll('[data-approve]').forEach(btn=>btn.onclick=async()=>{const r=h.items.find(r=>r.id===btn.dataset.approve);const ok=await ask('ยืนยันเงินเข้าธนาคาร',`<p>${esc(r.memberName)} • ${money(r.amount)}</p><label>เลขอ้างอิงที่ตรวจสอบ<input id="reference" value="${esc(r.reference||'')}"></label><label class="check"><input id="bankConfirmed" type="checkbox">ตรวจยอดเงินเข้าจากธนาคารแล้ว</label>`);if(ok){const confirmed=$('#bankConfirmed').checked,reference=$('#reference').value;if(!confirmed||!reference.trim()){await ask('ยังอนุมัติไม่ได้','กรุณาตรวจเงินเข้าจากธนาคารและระบุเลขอ้างอิง');return}mutate(btn,'secReview',{id:r.id,decision:'approve',bankConfirmed:true,reference},()=>load('reviews'))}});document.querySelectorAll('[data-reject]').forEach(btn=>btn.onclick=async()=>{if(await ask('ระบุเหตุผลที่ไม่ผ่าน','<label>เหตุผล<textarea id="reason"></textarea></label>'))mutate(btn,'secReview',{id:btn.dataset.reject,decision:'reject',reason:$('#reason').value},()=>load('reviews'))});pager(h);}
function notifications(){const h=data.history,d=data.diagnosis,last=data.lastRun;$('#content').innerHTML=hero('บอตทำงานอยู่ไหม? ดูได้ที่นี่','แยกผลการส่งกลุ่มและรายบุคคล • ไม่ถือว่ารับคำขอเท่ากับอ่านแล้ว')+`<div class="metrics"><div class="metric"><div class="muted">Trigger ที่ตรวจพบ</div><div class="value">${d.triggerCount} / 2</div></div><div class="metric"><div class="muted">ตรวจรายเดือนวันนี้</div><div class="value">${d.monthlyReminderWindow?'อยู่ในรอบ':'นอกรอบ'}</div></div><div class="metric"><div class="muted">รันล่าสุด</div><div>${last?esc(new Date(last.at).toLocaleString('th-TH')):'ยังไม่มีประวัติ'}</div></div></div><div class="card">${h.items.map(r=>`<div class="table-row"><div><span class="tag ${r.status==='failed'?'warn':''}">${esc(status(r.status))}</span><h3>${r.channel==='group'?'กลุ่มใหญ่':'ส่วนตัว'} • ${esc(r.target||'ไม่มี LINE ID')}</h3><p class="muted">${esc(r.billId)} • ${esc(r.day)} • ลอง ${Number(r.attempts)} ครั้ง</p><p class="small">${esc(r.message||'')}</p></div><span class="tag">HTTP ${esc(r.httpCode||'—')}</span></div>`).join('')||'<p>ยังไม่มีประวัติการส่ง</p>'}</div>`;pager(h);}
async function init(){route();if(!IS_LIFF){$('#content').innerHTML=hero('น้องกระปุก พร้อมดูแลทีมแล้ว','ดูบิล ส่งหลักฐาน และติดตามการใช้เงินของทีมได้ในที่เดียว')+`<div class="card stack"><h2>ยินดีต้อนรับสู่ SEC1</h2><p class="muted">เข้าสู่ระบบ LINE เพื่อดูข้อมูลตามสิทธิ์ของคุณ</p><a class="btn" href="https://liff.line.me/${CONFIG.liffId}?view=${encodeURIComponent(view)}">เข้าสู่ระบบด้วย LINE</a><p class="small muted">Admin ใช้บัญชีที่ตั้งไว้ใน LINE_ADMIN_USER_IDS</p></div>`;return}$('#content').innerHTML=skeleton();try{await loadSdk();await liff.init({liffId:CONFIG.liffId});route();if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}token=liff.getAccessToken();await load(view,1,billId)}catch(e){error(e)}}
function loadSdk(){return new Promise((resolve,reject)=>{if(window.liff)return resolve();const script=document.createElement('script');script.src='https://static.line-scdn.net/liff/edge/2/sdk.js';script.onload=resolve;script.onerror=()=>reject(Error('โหลด LINE ไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ต'));document.head.appendChild(script)})}
init();
</script></body></html>
