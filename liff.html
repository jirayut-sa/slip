<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Section 1</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root{--navy:#102a43;--teal:#0f766e;--blue:#2563eb;--bg:#f2f7f7;--card:#fff;--line:#dce7e7;--muted:#64748b;--danger:#dc2626;--ok:#059669}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#eef8f7,#f7f9fc 45%,#eef4ff);color:var(--navy);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit}.app{max-width:620px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;gap:12px;margin-bottom:14px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--blue),var(--teal));font-size:21px;box-shadow:0 8px 20px #0f766e33}
    h1{font-size:19px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #16324f0c}
    .hero{color:#fff;background:linear-gradient(135deg,#123b65,#0f766e);border:0}.hero .sub{color:#d8f4ef}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.stack{display:grid;gap:11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{display:grid;gap:5px;font-size:13px;font-weight:650}input,select,textarea{width:100%;border:1px solid #ccdada;border-radius:12px;padding:11px 12px;background:#fff;color:var(--navy);outline:0}input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0f766e16}
    button{border:0;border-radius:12px;padding:11px 14px;font-weight:750;cursor:pointer}.primary{color:#fff;background:linear-gradient(135deg,var(--blue),var(--teal))}.soft{color:var(--teal);background:#e8f7f4}.danger{color:#b91c1c;background:#feecec}.full{width:100%}button:disabled{opacity:.55;cursor:not-allowed}
    .badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#e8f7f4;color:var(--teal);font-size:11px;font-weight:750}.money{font-size:23px;font-weight:850}.muted{color:var(--muted)}.small{font-size:12px}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:14px;padding:13px}.item h3{font-size:15px;margin:0 0 5px}.item p{margin:3px 0;font-size:12px;color:var(--muted)}
    .members{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:13px}.member{display:flex;align-items:center;gap:9px;padding:10px;border-bottom:1px solid #edf2f2}.member:last-child{border:0}.member input{width:18px;height:18px}.member label{display:block;font-weight:600;flex:1}
    .drop{border:2px dashed #b7cecb;border-radius:16px;padding:24px 12px;text-align:center;background:#f6fbfa}.drop input{display:none}.preview{max-width:100%;max-height:260px;border-radius:13px;display:block;margin:10px auto}.notice{padding:10px 12px;border-radius:12px;background:#eff6ff;color:#1d4ed8;font-size:13px}.error{background:#fff1f2;color:#be123c}.success{background:#ecfdf5;color:#047857}
    .pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px}.skeleton{height:74px;border-radius:14px;margin:10px 0;background:linear-gradient(90deg,#e8eeee 25%,#f7fafa 45%,#e8eeee 65%);background-size:400% 100%;animation:shine 1.2s infinite}@keyframes shine{to{background-position:-135% 0}}
    .hide{display:none!important}.spinner{width:18px;height:18px;border:2px solid #ffffff70;border-top-color:#fff;border-radius:50%;display:inline-block;vertical-align:-4px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:390px){.grid2{grid-template-columns:1fr}.card{padding:14px}}
  </style>
</head>
<body>
  <main class="app">
    <header><div class="logo">฿</div><div><h1 id="title">ระบบเรียกเก็บเงิน</h1><div class="sub" id="identity">กำลังตรวจสอบบัญชี LINE</div></div></header>
    <section id="status"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>
    <section id="content" class="hide"></section>
  </main>
  <script>
  'use strict';
  const CONFIG={
    apiUrl:'https://script.google.com/macros/s/AKfycbyx6FHcm9gs3TeEopijpRug8z8sXpo9iLm6v3qavCj0-2W8zwA6keSWgAc6qiPj7mVzXw/exec',
    apiToken:'q4pIc1ZpvJnbjNZexdnv5EQ9c4DMyF1L',
    liffId:'2011470307-gvcrsOhk'
  };
  let currentView='my-bills';let currentPage=1;let currentBillId='';let accessToken='';let lastData=null;
  const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const baht=n=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:2}).format(Number(n)||0);
  const date=v=>{if(!v)return '-';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})};
  async function api(action,payload={}){const res=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:CONFIG.apiToken,action,...payload})});const out=await res.json();if(!out.success)throw new Error(out.message||'ระบบไม่สามารถทำรายการได้');return out}
  function setLoading(on){$('#status').classList.toggle('hide',!on);$('#content').classList.toggle('hide',on)}
  function showError(message){setLoading(false);$('#content').innerHTML=`<div class="card"><div class="notice error">${esc(message)}</div><button class="soft full" style="margin-top:12px" onclick="location.reload()">ลองอีกครั้ง</button></div>`}
  function readRouteAfterInit(){const params=new URLSearchParams(location.search);let view=params.get('view')||'';let billId=params.get('billId')||'';const rawState=params.get('liff.state')||'';if(rawState&&(!view||!billId)){let state=rawState;try{state=decodeURIComponent(state)}catch(e){}const queryAt=state.indexOf('?');const stateQuery=queryAt>=0?state.slice(queryAt+1):state.replace(/^\/?/, '');const extra=new URLSearchParams(stateQuery);if(!view)view=extra.get('view')||'';if(!billId)billId=extra.get('billId')||''}const allowed=['create-bill','create-withdrawal','my-bills','open-bills','summary','expenses','payment'];currentBillId=billId;currentView=billId?'payment':(allowed.includes(view)?view:'my-bills')}
  async function start(){try{await liff.init({liffId:CONFIG.liffId});readRouteAfterInit();if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}accessToken=liff.getAccessToken();if(!accessToken)throw new Error('ไม่สามารถรับสิทธิ์จาก LINE ได้ กรุณาปิดแล้วเปิดเมนูใหม่');await loadView(currentView,1,currentBillId)}catch(e){showError(e.message)}}
  async function loadView(view,page=1,billId=''){setLoading(true);currentView=view;currentPage=page;currentBillId=billId;try{const out=await api('getLiffViewData',{liffAccessToken:accessToken,view,page,billId});lastData=out;$('#identity').textContent=out.session.memberName||out.session.displayName||'สมาชิก LINE';render(out);setLoading(false)}catch(e){showError(e.message)}}
  function render(out){const d=out.data;const names={'create-bill':'สร้างบิล','create-withdrawal':'บันทึกถอนเงิน','my-bills':'บิลของฉัน','open-bills':'บิลที่กำลังเรียกเก็บ','summary':'สรุปยอดเงิน','expenses':'รายจ่ายทั้งหมด','payment':'ส่งสลิป'};$('#title').textContent=names[out.view]||'ระบบเรียกเก็บเงิน';if(out.view==='create-bill')renderCreate(d);else if(out.view==='create-withdrawal')renderWithdrawal(d);else if(out.view==='summary')renderSummary(d);else if(out.view==='expenses')renderExpenses(d);else if(out.view==='payment')renderPayment(d);else renderBills(d,out.view)}
  function renderCreate(d){$('#content').innerHTML=`<form class="card stack" id="billForm"><div class="grid2"><label>ประเภทบิล<select id="billType"><option value="activity">กิจกรรมเฉพาะกิจ</option><option value="monthly">รายเดือน</option></select></label><label>ยอดต่อคน<input id="amount" type="number" min="1" step="0.01" required></label></div><label>ชื่อบิล / กิจกรรม<input id="billTitle" required maxlength="100"></label><div class="grid2"><label id="dateLabel">วันครบกำหนด<input id="dueDate" type="date" required></label><label id="dayLabel" class="hide">วันที่ครบกำหนดทุกเดือน<input id="dueDay" type="number" min="1" max="28" value="28"></label></div><div class="row between"><b>เลือกสมาชิก</b><button type="button" class="soft" id="toggleAll">เลือกทั้งหมด</button></div><div class="members">${d.members.map(m=>`<div class="member"><input class="memberCheck" type="checkbox" value="${esc(m.id)}" id="m_${esc(m.id)}"><label for="m_${esc(m.id)}">${esc(m.name)}</label></div>`).join('')||'<div class="member muted">ยังไม่มีสมาชิก</div>'}</div><label>หมายเหตุ<textarea id="note" rows="2"></textarea></label><button class="primary full" id="submitBill">สร้างบิล</button><div id="formMsg"></div></form>`;$('#dueDate').value=new Date(Date.now()+7*86400000).toISOString().slice(0,10);$('#billType').onchange=e=>{const monthly=e.target.value==='monthly';$('#dateLabel').classList.toggle('hide',monthly);$('#dayLabel').classList.toggle('hide',!monthly);$('#dueDate').required=!monthly};$('#toggleAll').onclick=()=>{const checks=[...document.querySelectorAll('.memberCheck')],all=checks.every(x=>x.checked);checks.forEach(x=>x.checked=!all)};$('#billForm').onsubmit=createBill}
  async function createBill(e){e.preventDefault();const btn=$('#submitBill'),type=$('#billType').value,memberIds=[...document.querySelectorAll('.memberCheck:checked')].map(x=>x.value);if(!memberIds.length){$('#formMsg').innerHTML='<div class="notice error">กรุณาเลือกสมาชิกอย่างน้อย 1 คน</div>';return}btn.disabled=true;btn.innerHTML='<span class="spinner"></span> กำลังสร้าง';try{await api('createLiffBill',{liffAccessToken:accessToken,billType:type,title:$('#billTitle').value,amountPerMember:$('#amount').value,dueDate:$('#dueDate').value,dueDay:$('#dueDay').value,memberIds,note:$('#note').value});$('#formMsg').innerHTML='<div class="notice success">สร้างบิลสำเร็จ และส่งแจ้งเตือนแล้ว</div>';e.target.reset()}catch(err){$('#formMsg').innerHTML=`<div class="notice error">${esc(err.message)}</div>`}finally{btn.disabled=false;btn.textContent='สร้างบิล'}}
  function renderBills(d,view){const h=d.history;$('#content').innerHTML=`<div class="list">${h.items.map(b=>`<article class="item card"><div class="row between"><h3>${esc(b.title)}</h3><span class="badge">${b.billType==='monthly'?'รายเดือน':'กิจกรรม'}</span></div><p>ครบกำหนด ${date(b.dueDate)}</p><div class="row between"><b>${baht(b.amount??b.totalExpected)}</b><span class="small muted">${view==='my-bills'?statusText(b.paymentStatus):`${b.paidCount}/${b.memberCount} คน`}</span></div>${view==='my-bills'&&b.paymentStatus!=='paid'?`<button class="primary full" style="margin-top:10px" onclick="loadView('payment',1,'${esc(b.id)}')">เปิดบิลและส่งสลิป</button>`:''}</article>`).join('')||'<div class="card muted">ไม่พบรายการ</div>'}</div>${pager(h)}`;bindPager(h)}
  function statusText(s){return s==='paid'?'ชำระแล้ว':s==='partial'?'ชำระบางส่วน':'ยังไม่ชำระ'}
  function renderSummary(d){const s=d.financeSummary;$('#content').innerHTML=`<div class="grid2"><div class="card"><div class="small muted">เงินเข้าทั้งหมด</div><div class="money">${baht(s.income)}</div></div><div class="card"><div class="small muted">คงเหลือสุทธิ</div><div class="money">${baht(s.balance)}</div></div><div class="card"><div class="small muted">รายจ่าย</div><div class="money">${baht(s.expenses)}</div></div><div class="card"><div class="small muted">ถอนเงินใช้</div><div class="money">${baht(s.withdrawn)}</div></div></div><div class="card hero"><div class="sub">ยอดค้างชำระจากบิลเปิด</div><div class="money">${baht(s.outstanding)}</div></div>`}
  function renderExpenses(d){const h=d.history,admin=lastData.session.isAdmin;$('#content').innerHTML=`${admin?'<button class="primary full" id="newWithdrawal">+ บันทึกถอนเงิน</button>':''}<div class="list">${h.items.map(x=>`<article class="item card"><div class="row between"><h3>${esc(x.title)}</h3><b style="color:var(--danger)">-${baht(x.amount)}</b></div><p>${x.kind==='withdrawal'?'ถอนเงินไปใช้':'รายจ่าย'} · ${date(x.date)}</p></article>`).join('')||'<div class="card muted">ยังไม่มีรายจ่าย</div>'}</div>${pager(h)}`;if(admin)$('#newWithdrawal').onclick=()=>loadView('create-withdrawal',1);bindPager(h)}
  let withdrawalImage=null;function renderWithdrawal(d){$('#content').innerHTML=`<div class="card hero"><div class="sub">ยอดคงเหลือก่อนถอน</div><div class="money">${baht(d.availableBalance)}</div></div><form class="card stack" id="withdrawForm"><label>วันที่ถอน<input id="withdrawDate" type="date" value="${esc(d.today)}" required></label><label>จำนวนเงิน<input id="withdrawAmount" type="number" min="0.01" max="${esc(d.availableBalance)}" step="0.01" required></label><label>นำไปใช้ทำอะไร<textarea id="withdrawPurpose" rows="3" required maxlength="300"></textarea></label><label class="drop" for="withdrawFile"><b>แนบสลิปหรือหลักฐาน</b><div class="small muted">รูปจะถูกย่อก่อนอัปโหลด</div><input id="withdrawFile" type="file" accept="image/*" required></label><img id="withdrawPreview" class="preview hide" alt="หลักฐานการถอน"><button class="primary full" id="withdrawBtn">บันทึกถอนเงิน</button><div id="withdrawMsg"></div></form>`;$('#withdrawFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{withdrawalImage=await compressImage(f,900,.68);$('#withdrawPreview').src=withdrawalImage.dataUrl;$('#withdrawPreview').classList.remove('hide')}catch(err){$('#withdrawMsg').innerHTML=`<div class="notice error">${esc(err.message)}</div>`}};$('#withdrawForm').onsubmit=submitWithdrawal}
  async function submitWithdrawal(e){e.preventDefault();if(!withdrawalImage){$('#withdrawMsg').innerHTML='<div class="notice error">กรุณาแนบหลักฐาน</div>';return}const btn=$('#withdrawBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> กำลังบันทึก';try{await api('createLiffWithdrawal',{liffAccessToken:accessToken,date:$('#withdrawDate').value,amount:$('#withdrawAmount').value,purpose:$('#withdrawPurpose').value,imageBase64:withdrawalImage.dataUrl,mimeType:withdrawalImage.mimeType});$('#withdrawForm').innerHTML='<div class="notice success"><b>บันทึกถอนเงินสำเร็จ</b><br>ยอดคงเหลือและยอดถอนนำไปใช้ได้รับการอัปเดตแล้ว</div><button type="button" class="soft full" id="viewExpenses">ดูรายการใช้เงิน</button>';$('#viewExpenses').onclick=()=>loadView('expenses',1)}catch(err){$('#withdrawMsg').innerHTML=`<div class="notice error">${esc(err.message)}</div>`;btn.disabled=false;btn.textContent='บันทึกถอนเงิน'}}
  function pager(h){if(h.pages<=1)return'';return`<div class="pager"><button class="soft" id="prev" ${h.hasPrevious?'':'disabled'}>ก่อนหน้า</button><span class="small">${h.page} / ${h.pages}</span><button class="soft" id="next" ${h.hasNext?'':'disabled'}>ถัดไป</button></div>`}
  function bindPager(h){const p=$('#prev'),n=$('#next');if(p)p.onclick=()=>loadView(currentView,h.page-1,currentBillId);if(n)n.onclick=()=>loadView(currentView,h.page+1,currentBillId)}
  function renderPayment(d){const b=d.bill,a=d.assignment,k=d.bank;$('#content').innerHTML=`<div class="card hero"><span class="badge">${b.billType==='monthly'?'เก็บเงินรายเดือน':'กิจกรรมเฉพาะกิจ'}</span><h2>${esc(b.title)}</h2><div class="sub">สมาชิก ${esc(lastData.session.memberName)}</div><div class="money">${baht(Math.max(0,a.amount-a.paidAmount))}</div></div><div class="card stack"><b>บัญชีรับเงิน</b><div>${esc(k.bankName)}</div><div class="row between"><span class="money" style="font-size:20px" id="account">${esc(k.bankAccountNo)}</span><button class="soft" id="copy">คัดลอก</button></div><div class="muted small">${esc(k.bankAccountName)}</div></div><div class="card stack" id="uploadCard"><label class="drop" for="slipFile"><b>แตะเพื่อเลือกรูปสลิป</b><div class="small muted">ระบบจะย่อรูปและอัปโหลดเพียงครั้งเดียว</div><input id="slipFile" type="file" accept="image/*"></label><img id="preview" class="preview hide" alt="ตัวอย่างสลิป"><button class="primary full" id="uploadBtn" disabled>อัปโหลดและตรวจสลิป</button><div id="uploadMsg"></div></div>`;$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(k.bankAccountNo)}catch(e){const t=document.createElement('textarea');t.value=k.bankAccountNo;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}$('#copy').textContent='คัดลอกแล้ว'};$('#slipFile').onchange=selectSlip;$('#uploadBtn').onclick=uploadSlip}
  let selectedImage=null,pendingToken='';async function selectSlip(e){const f=e.target.files[0];if(!f)return;try{selectedImage=await compressImage(f,900,.68);$('#preview').src=selectedImage.dataUrl;$('#preview').classList.remove('hide');$('#uploadBtn').disabled=false;$('#uploadMsg').innerHTML=`<div class="small muted">ขนาดหลังย่อ ${Math.ceil(selectedImage.dataUrl.length*0.75/1024)} KB</div>`}catch(err){$('#uploadMsg').innerHTML=`<div class="notice error">${esc(err.message)}</div>`}}
  function compressImage(file,max,quality){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const dataUrl=c.toDataURL('image/jpeg',quality);URL.revokeObjectURL(url);resolve({dataUrl,mimeType:'image/jpeg'})};img.onerror=()=>reject(new Error('ไม่สามารถอ่านรูปนี้ได้'));img.src=url})}
  async function uploadSlip(){const btn=$('#uploadBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> กำลังอัปโหลดและตรวจ OCR';try{const out=await api('uploadLiffSlip',{liffAccessToken:accessToken,billId:currentBillId,imageBase64:selectedImage.dataUrl,mimeType:selectedImage.mimeType});pendingToken=out.pendingToken;const p=out.ocr.parsed||{};$('#uploadCard').innerHTML=`<div class="notice success">อัปโหลดรูปเรียบร้อยแล้ว กรุณาตรวจข้อมูลก่อนยืนยัน</div><label>ยอดเงิน<input id="confirmAmount" type="number" min="0.01" step="0.01" value="${esc(p.amount||out.expectedAmount)}"></label><label>วันที่โอน<input id="confirmDate" type="date" value="${esc(p.date||new Date().toISOString().slice(0,10))}"></label><div class="small muted">ผู้โอนจาก OCR: ${esc(p.senderName||'อ่านไม่ได้')}<br>ธนาคาร: ${esc(p.senderBank||p.bankApp||'อ่านไม่ได้')}</div><label>หมายเหตุ<textarea id="confirmNote" rows="2"></textarea></label><button class="primary full" id="confirmBtn">ยืนยันและบันทึก</button><div id="confirmMsg"></div>`;$('#confirmBtn').onclick=confirmSlip}catch(err){$('#uploadMsg').innerHTML=`<div class="notice error">${esc(err.message)}</div>`;btn.disabled=false;btn.textContent='อัปโหลดและตรวจสลิป'}}
  async function confirmSlip(){const btn=$('#confirmBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> กำลังบันทึก';try{await api('confirmLiffSlip',{liffAccessToken:accessToken,pendingToken,amount:$('#confirmAmount').value,date:$('#confirmDate').value,note:$('#confirmNote').value});$('#uploadCard').innerHTML='<div class="notice success"><b>บันทึกสำเร็จ</b><br>สถานะบิลได้รับการอัปเดตแล้ว</div><button class="soft full" id="backBills">กลับไปบิลของฉัน</button>';$('#backBills').onclick=()=>loadView('my-bills',1)}catch(err){$('#confirmMsg').innerHTML=`<div class="notice error">${esc(err.message)}</div>`;btn.disabled=false;btn.textContent='ยืนยันและบันทึก'}}
  start();
  </script>
</body>
</html>
